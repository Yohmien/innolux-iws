server:
  port: ${IAM_SERVER_PORT:18081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    dynamic:
      datasource:
        master:
          url: ${IWS_DB_URL:}
          username: ${IWS_DB_USERNAME:}
          password: ${IWS_DB_PASSWORD:}
  data:
    redis:
      host: ${IWS_REDIS_HOST:127.0.0.1}
      port: ${IWS_REDIS_PORT:6379}
      database: ${IAM_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

redisson:
  keyPrefix: ${IAM_REDIS_KEY_PREFIX:innolux-iam}

sa-token:
  jwt-secret-key: ${IAM_SA_TOKEN_JWT_SECRET:}

iam:
  public-base-url: ${IAM_PUBLIC_BASE_URL:http://127.0.0.1:18081/iam}
  frontends:
    web-main:
      enabled: true
      terminal: WEB
      public-base-url: ${IAM_WEB_MAIN_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_WEB_MAIN_LAUNCH_URI:}
      redirect-uri: ${IAM_WEB_MAIN_REDIRECT_URI:}
      logout-uri: ${IAM_WEB_MAIN_LOGOUT_URI:}
    web-branch:
      enabled: true
      terminal: WEB
      public-base-url: ${IAM_WEB_BRANCH_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_WEB_BRANCH_LAUNCH_URI:}
      redirect-uri: ${IAM_WEB_BRANCH_REDIRECT_URI:}
      logout-uri: ${IAM_WEB_BRANCH_LOGOUT_URI:}
    pda-main:
      enabled: true
      terminal: PDA
      public-base-url: ${IAM_PDA_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_PDA_LAUNCH_URI:}
      redirect-uri: ${IAM_PDA_REDIRECT_URI:}
      logout-uri: ${IAM_PDA_LOGOUT_URI:}
    job-main:
      enabled: true
      terminal: WEB
      public-base-url: ${IAM_JOB_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_JOB_LAUNCH_URI:}
      redirect-uri: ${IAM_JOB_REDIRECT_URI:}
      logout-uri: ${IAM_JOB_LOGOUT_URI:}
    ai-main:
      enabled: true
      terminal: WEB
      public-base-url: ${IAM_AI_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_AI_LAUNCH_URI:}
      redirect-uri: ${IAM_AI_REDIRECT_URI:}
      logout-uri: ${IAM_AI_LOGOUT_URI:}
    monitor-main:
      enabled: true
      terminal: WEB
      public-base-url: ${IAM_MONITOR_PUBLIC_BASE_URL:}
      launch-uri: ${IAM_MONITOR_LAUNCH_URI:}
      redirect-uri: ${IAM_MONITOR_REDIRECT_URI:}
      logout-uri: ${IAM_MONITOR_LOGOUT_URI:}
  applications:
    iws-a:
      type: IWS
      name: IWS+ A
      terminals: [WEB, PDA]
      api-base-url: ${IAM_IWS_A_API_BASE_URL:/iws-a-api}
      allowed-frontend-ids: [web-main, web-branch, pda-main]
      access-permission: ${IAM_IWS_A_ACCESS_PERMISSION:iam:app:iws:a}
      client-secret: ${IAM_IWS_A_CLIENT_SECRET:}
      session-namespace: ${IAM_IWS_A_SESSION_NAMESPACE:}
      allowed-instance-ids:
        - ${IAM_IWS_A_INSTANCE_ID_1:}
        - ${IAM_IWS_A_INSTANCE_ID_2:}
    iws-b:
      type: IWS
      name: IWS+ B
      terminals: [WEB, PDA]
      api-base-url: ${IAM_IWS_B_API_BASE_URL:/iws-b-api}
      allowed-frontend-ids: [web-main, web-branch, pda-main]
      access-permission: ${IAM_IWS_B_ACCESS_PERMISSION:iam:app:iws:b}
      client-secret: ${IAM_IWS_B_CLIENT_SECRET:}
      session-namespace: ${IAM_IWS_B_SESSION_NAMESPACE:}
      allowed-instance-ids:
        - ${IAM_IWS_B_INSTANCE_ID_1:}
    snail-job:
      type: SNAIL_JOB
      name: 任务调度中心
      terminals: [WEB]
      api-base-url: ${IAM_SNAILJOB_API_BASE_URL:/snail-job}
      allowed-frontend-ids: [job-main]
      access-permission: ${IAM_SNAILJOB_ACCESS_PERMISSION:monitor:snailjob:list}
      client-secret: ${IAM_SNAILJOB_CLIENT_SECRET:}
      session-namespace: ${IAM_SNAILJOB_SESSION_NAMESPACE:}
      allowed-instance-ids:
        - ${IAM_SNAILJOB_INSTANCE_ID_1:}
    snail-ai:
      type: SNAIL_AI
      name: AI 控制台
      terminals: [WEB]
      api-base-url: ${IAM_SNAILAI_API_BASE_URL:/snail-ai}
      allowed-frontend-ids: [ai-main]
      access-permission: ${IAM_SNAILAI_ACCESS_PERMISSION:monitor:snailai:list}
      client-secret: ${IAM_SNAILAI_CLIENT_SECRET:}
      session-namespace: ${IAM_SNAILAI_SESSION_NAMESPACE:}
      allowed-instance-ids:
        - ${IAM_SNAILAI_INSTANCE_ID_1:}
    admin-monitor:
      type: ADMIN_MONITOR
      name: Admin 监控
      terminals: [WEB]
      api-base-url: ${IAM_MONITOR_API_BASE_URL:/admin}
      allowed-frontend-ids: [monitor-main]
      access-permission: ${IAM_MONITOR_ACCESS_PERMISSION:monitor:admin:list}
      client-secret: ${IAM_MONITOR_CLIENT_SECRET:}
      session-namespace: ${IAM_MONITOR_SESSION_NAMESPACE:}
      allowed-instance-ids:
        - ${IAM_MONITOR_INSTANCE_ID_1:}
  views:
    - application-type: IWS
      terminal: WEB
      view-key: index
      name: IWS 首页
    - application-type: IWS
      terminal: WEB
      view-key: system/user/index
      name: 用户管理
    - application-type: IWS
      terminal: WEB
      view-key: system/role/index
      name: 角色管理
    - application-type: IWS
      terminal: WEB
      view-key: system/dept/index
      name: 部门管理
    - application-type: IWS
      terminal: WEB
      view-key: system/post/index
      name: 岗位管理
    - application-type: IWS
      terminal: WEB
      view-key: system/menu/index
      name: 菜单管理
    - application-type: IWS
      terminal: WEB
      view-key: system/client/index
      name: 客户端管理
    - application-type: IWS
      terminal: WEB
      view-key: system/user/profile/index
      name: 个人设置
    - application-type: IWS
      terminal: PDA
      view-key: pages/work/index
      name: PDA 工作台
    - application-type: IWS
      terminal: PDA
      view-key: pages/work/inventory/locate
      name: PDA 在库定位
