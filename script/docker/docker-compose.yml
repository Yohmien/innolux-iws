# @Module       : IWS 智能仓储管理系统
# @Version      : V1.0
# @Description  : 统一前后端命名、基础架构、数据库脚本与智能仓储业务入口；
# @ModifyRecord : V1.0 新建；

services:
  mysql:
    image: mysql:8.4.9
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: 12345
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: innolux_iws
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.31.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config:rw
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}"
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?请设置至少 8 位的 MINIO_ROOT_PASSWORD}"
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  iws-server1:
    image: iws/iws-server:1.0.0
    container_name: iws-server1
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 18080
      SNAIL_JOB_PORT: 18280
      SNAIL_AI_PORT: 18380
    volumes:
      # 配置文件
      - /docker/server1/logs/:/iws/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/iws/skywalking/agent
    privileged: true
    network_mode: "host"

  iws-server2:
    image: iws/iws-server:1.0.0
    container_name: iws-server2
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 18081
      SNAIL_JOB_PORT: 18281
      SNAIL_AI_PORT: 18381
    volumes:
      # 配置文件
      - /docker/server2/logs/:/iws/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/iws/skywalking/agent
    privileged: true
    network_mode: "host"

  iws-monitor-admin:
    image: iws/iws-monitor-admin:1.0.0
    container_name: iws-monitor-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/monitor/logs/:/iws/monitor/logs
    privileged: true
    network_mode: "host"

  iws-snailjob-server:
    image: iws/iws-snailjob-server:1.0.0
    container_name: iws-snailjob-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "18088:18088"
      - "18188:18188"
    volumes:
      - /docker/snailjob/logs/:/iws/snailjob/logs
    privileged: true
    network_mode: "host"

  iws-snailai-server:
    image: iws/iws-snailai-server:1.0.0
    container_name: iws-snailai-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # Docling 与 PaddleOCR 服务需单独部署；host 网络模式下默认通过宿主机端口访问
      SNAIL_AI_RAG_DOCLING_ENABLED: ${SNAIL_AI_RAG_DOCLING_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_URL: ${SNAIL_AI_RAG_DOCLING_URL:-http://127.0.0.1:5100}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL:-http://127.0.0.1:8866/ocr}
    ports:
      - "18089:18089"
      - "18189:18189"
    volumes:
      - /docker/snailai/logs/:/iws/snailai/logs
    privileged: true
    network_mode: "host"
