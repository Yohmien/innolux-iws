spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IWS_DB_URL:jdbc:mysql://localhost:3306/innolux-iws?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${IWS_DB_USERNAME:root}
    password: ${IWS_DB_PASSWORD:abc123}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 900000
      keepaliveTime: 30000

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  url: ${MONITOR_URL:http://127.0.0.1:18090/admin}
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: ${SPRING_BOOT_ADMIN_CLIENT_USERNAME:iws-monitor}
  password: ${SPRING_BOOT_ADMIN_CLIENT_PASSWORD:iws-monitor-local-dev}

iam:
  client:
    client-secret: ${IAM_SNAILAI_CLIENT_SECRET:iws-local-dev-client-ai}
    accounts:
      innolux: innolux

snail-ai:
  crypto:
    secret-key: ${SNAIL_AI_CRYPTO_KEY:0123456789abcdef0123456789abcdef}
