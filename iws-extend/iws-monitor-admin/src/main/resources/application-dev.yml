iam:
  client:
    client-secret: ${IAM_APPLICATION_SECRET:iws-local-dev-client-monitor}

spring:
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:iws-monitor}
      password: ${SPRING_SECURITY_USER_PASSWORD:iws-monitor-local-dev}

spring.boot.admin.client:
  username: ${SPRING_BOOT_ADMIN_CLIENT_USERNAME:${spring.security.user.name}}
  password: ${SPRING_BOOT_ADMIN_CLIENT_PASSWORD:${spring.security.user.password}}
