# @ModifyRecord : V1.0 新建；

iws:
  endpoint:
    enabled: true
    current-environment: ${IWS_APK_ENVIRONMENT:dev}
  process:
    enabled: true
    scheduler:
      enabled: false
    immediate:
      max-concurrency: ${IWS_APK_MAX_CONCURRENCY:4}
      response-reserve-ms: ${IWS_APK_RESPONSE_RESERVE_MS:500}
